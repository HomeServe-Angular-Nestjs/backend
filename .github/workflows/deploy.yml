name: CI/CD – Deploy NestJS Backend (pnpm) to Render

on:
  push:
    branches:
      - main

jobs:
  ci-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5️⃣ Run tests
      - name: Run tests
        run: pnpm test -- --passWithNoTests

      # 6️⃣ Build NestJS app (validates the deploy won't break)
      - name: Build application
        run: pnpm build

      # 7️⃣ Trigger Render deployment via Deploy Hook
      # Get the hook URL: Render Dashboard → your service → Settings → Deploy Hook
      # Store it as a GitHub secret named RENDER_DEPLOY_HOOK_URL
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --url "$RENDER_DEPLOY_HOOK_URL"
